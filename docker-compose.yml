version: '3.8'

services:
  detector-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rubiks_visual_detector
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./coverage.xml:/app/coverage.xml
    environment:
      - DEBUG=True
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
