<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's YOLO Dataset Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #121214; 
            color: #fff;
            overflow: hidden;
        }
        
        #3d-container { 
            position: absolute;
            top: 0;
            bottom: 0;
            left: 350px;
            right: 350px;
            z-index: 1;
            cursor: grab;
            background: #121214;
        }
        #3d-container:active { 
            cursor: grabbing; 
        }

        .panel {
            position: absolute;
            width: 350px; 
            height: 100vh;
            padding: 1.5rem; 
            background: rgba(28, 28, 36, 0.95); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 10;
            overflow-y: auto;
        }
        #left-panel { 
            top: 0;
            left: 0; 
            border-right: 1px solid rgba(255,255,255,0.05); 
        }
        #right-panel { 
            top: 0;
            right: 0; 
            border-left: 1px solid rgba(255,255,255,0.05); 
        }

        h2, h3 { 
            margin-top: 0; 
            color: #4CAF50; 
            font-size: 1.4rem;
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: #aaa; 
            font-size: 0.85rem;
        }
        input, select { 
            padding: 0.7rem; 
            width: 100%; 
            font-size: 0.95rem; 
            margin-bottom: 1rem;
            background: rgba(18, 18, 20, 0.8);
            border: 1px solid #3a3a44;
            color: white;
            border-radius: 6px;
        }
        input[readonly] {
            color: #4CAF50;
            background: rgba(10, 10, 12, 0.8);
            cursor: default;
        }

        button { 
            padding: 0.75rem; 
            width: 100%; 
            font-size: 0.95rem; 
            font-weight: bold;
            cursor: pointer; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            transition: all 0.2s ease;
            margin-bottom: 0.5rem;
        }
        button:hover { 
            background: #45a049; 
        }
        button:disabled { 
            background: #2a2a35; 
            cursor: not-allowed; 
            color: #5a5a65; 
            border: 1px solid #323240;
        }
        
        button.action-btn { 
            background: #e91e63; 
        }
        button.action-btn:hover { 
            background: #d81b60; 
        }

        #result-box {
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(18, 18, 20, 0.8);
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            font-family: monospace;
            min-height: 45px;
            font-size: 0.85rem;
            word-wrap: break-word;
            margin-bottom: 1rem;
        }
        #status { 
            font-size: 0.85rem; 
            margin-bottom: 1rem; 
            color: #ff9800; 
            font-weight: bold;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .class-badge {
            background: rgba(50, 50, 65, 0.6);
            border: 1px solid #3a3a44;
            font-size: 0.85rem;
            padding: 0.6rem 0.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

        .mobile-action-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .mobile-action-row button {
            flex: 1;
            margin-bottom: 0;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(18, 18, 20, 0.8);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.5rem;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #4CAF50;
            transition: width 0.1s linear;
        }

        /* MOBILE FIXES & ALIGNMENT FROM SOLVER */
        @media (max-width: 900px) {
            body {
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: -webkit-fill-available;
            }
            
            #3d-container {
                position: relative;
                width: 100vw;
                height: 40vh; 
                flex: none;
                left: 0;
                right: 0;
                top: 0;
                bottom: auto;
            }
            
            #left-panel h2, #right-panel h3, #right-panel p, .desktop-only {
                display: none !important;
            }

            .panel {
                position: relative;
                width: 100vw;
                height: auto;
                box-shadow: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                overflow: hidden;
                background: #1c1c24;
                flex: none;
            }

            #left-panel {
                padding: 0.4rem 1rem 0 1rem;
                border: none;
            }
            
            #status {
                margin-bottom: 0.2rem;
                font-size: 0.8rem;
            }

            label {
                margin-bottom: 0.2rem;
            }

            input, select {
                padding: 0.4rem 0.6rem;
                margin-bottom: 0.2rem;
                font-size: 0.85rem;
                width: 100%;
            }
            
            #result-box {
                margin-top: 0.2rem;
                padding: 0.5rem;
                min-height: 35px;
                max-height: 55px;
                overflow-y: auto;
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
                width: 100%;
                border-left: 3px solid #4CAF50;
            }

            #right-panel {
                padding: 0.1rem 1rem 0.6rem 1rem;
                border: none;
                margin-top: 0;
            }

            .mobile-action-row {
                display: flex;
                gap: 8px;
                padding: 0.1rem 0 0.3rem 0;
                background: #1c1c24;
                width: 100%;
            }
            .mobile-action-row button {
                flex: 1;
                padding: 0.6rem 0;
                font-size: 0.9rem;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    
    <div id="3d-container"></div>

    <!-- LEFT PANEL -->
    <div id="left-panel" class="panel">
        <h2>Dataset Studio</h2>
        <div id="status">Studio Ready</div>
        
        <label for="samples-count">Number of samples:</label>
        <input type="number" id="samples-count" value="100" min="10" max="2000" step="10">

        <div class="desktop-only">
            <label for="resolution-select">Image resolution:</label>
            <select id="resolution-select">
                <option value="640" selected>640 x 640 (YOLO Standard)</option>
                <option value="416">416 x 416 (Fast Mobile)</option>
                <option value="800">800 x 800 (High-Res)</option>
            </select>
        </div>

        <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="result-box">Ready. Configure moves & export.</div>

        <div class="mobile-action-row">
            <button id="randomize-preview-btn" class="action-btn">Randomize</button>
            <button id="generate-btn">Generate ZIP</button>
        </div>
        <div style="margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; color: #ff9800; font-weight: bold; letter-spacing: 0.05em; text-align: center;">
            Morse Code ..- ._ 📟
        </div>
    </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel" class="panel">
        <h3>YOLO Classes</h3>
        <p style="color:#aaa; font-size: 0.9rem; margin-top:0;">WCA standard 6-class configuration</p>
        
        <div class="class-grid">
            <div class="class-badge"><span class="color-dot" style="background:#ffffff; border:1px solid #666;"></span> 0: White</div>
            <div class="class-badge"><span class="color-dot" style="background:#ffd500;"></span> 1: Yellow</div>
            <div class="class-badge"><span class="color-dot" style="background:#009b48;"></span> 2: Green</div>
            <div class="class-badge"><span class="color-dot" style="background:#0046ad;"></span> 3: Blue</div>
            <div class="class-badge"><span class="color-dot" style="background:#b71234;"></span> 4: Red</div>
            <div class="class-badge"><span class="color-dot" style="background:#ff5800;"></span> 5: Orange</div>
        </div>

        <div style="margin-top: 1.5rem; font-size: 0.85rem; color: #888; line-height: 1.4;">
            <strong style="color:#4CAF50;">Hybrid Pipeline:</strong><br>
            80% Train / 20% Val split automatically formatted for YOLO11 training.
        </div>
    </div>

    <script>
        const COLOR_CLASSES = [
            { id: 0, name: 'white',  hex: 0xffffff },
            { id: 1, name: 'yellow', hex: 0xffd500 },
            { id: 2, name: 'green',  hex: 0x009b48 },
            { id: 3, name: 'blue',   hex: 0x0046ad },
            { id: 4, name: 'red',    hex: 0xb71234 },
            { id: 5, name: 'orange', hex: 0xff5800 }
        ];

        const container = document.getElementById('3d-container');
        const statusEl = document.getElementById('status');
        const resultBox = document.getElementById('result-box');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const generateBtn = document.getElementById('generate-btn');
        const randomizeBtn = document.getElementById('randomize-preview-btn');

        // Three.js scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#121214');

        const width = container.clientWidth || (window.innerWidth - 700);
        const height = container.clientHeight || window.innerHeight;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(5.5, 4.5, 6.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = 0.8;
        controls.target.set(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(10, 15, 10);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(-10, -5, -10);
        scene.add(fillLight);

        // Core Cube (Constant 1.0 Scale, identical to solver)
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        const coreGeo = new THREE.BoxGeometry(2.96, 2.96, 2.96);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x111114, roughness: 0.85 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        cubeGroup.add(coreMesh);

        const stickers = [];
        const stickerGeo = new THREE.PlaneGeometry(0.88, 0.88);

        const facesConfig = [
            { dir: new THREE.Vector3(0, 1, 0),  colorClass: COLOR_CLASSES[0] }, // Up: White
            { dir: new THREE.Vector3(0, -1, 0), colorClass: COLOR_CLASSES[1] }, // Down: Yellow
            { dir: new THREE.Vector3(0, 0, 1),  colorClass: COLOR_CLASSES[2] }, // Front: Green
            { dir: new THREE.Vector3(0, 0, -1), colorClass: COLOR_CLASSES[3] }, // Back: Blue
            { dir: new THREE.Vector3(1, 0, 0),  colorClass: COLOR_CLASSES[4] }, // Right: Red
            { dir: new THREE.Vector3(-1, 0, 0), colorClass: COLOR_CLASSES[5] }  // Left: Orange
        ];

        facesConfig.forEach(({ dir, colorClass }) => {
            for (let u = -1; u <= 1; u++) {
                for (let v = -1; v <= 1; v++) {
                    const mat = new THREE.MeshStandardMaterial({
                        color: colorClass.hex,
                        roughness: 0.35,
                        metalness: 0.05,
                        side: THREE.DoubleSide
                    });

                    const mesh = new THREE.Mesh(stickerGeo, mat);
                    const offset = 1.505;

                    if (Math.abs(dir.x) > 0) {
                        mesh.position.set(dir.x * offset, v, u);
                        mesh.rotation.y = dir.x > 0 ? Math.PI / 2 : -Math.PI / 2;
                    } else if (Math.abs(dir.y) > 0) {
                        mesh.position.set(u, dir.y * offset, v);
                        mesh.rotation.x = dir.y > 0 ? -Math.PI / 2 : Math.PI / 2;
                    } else {
                        mesh.position.set(u, v, dir.z * offset);
                        mesh.rotation.y = dir.z > 0 ? 0 : Math.PI;
                    }

                    cubeGroup.add(mesh);
                    stickers.push({ mesh, normal: dir.clone(), activeColorClass: colorClass });
                }
            }
        });

        // Fixed 1.0 scale (no random scaling of the cube)
        function randomizeCubeAppearance() {
            cubeGroup.rotation.x = (Math.random() - 0.5) * (Math.PI * 0.22);
            cubeGroup.rotation.y = (Math.random() - 0.5) * (Math.PI * 0.22);
            cubeGroup.rotation.z = (Math.random() - 0.5) * (Math.PI * 0.15);

            ambientLight.intensity = 0.5 + Math.random() * 0.5;
            dirLight.intensity = 1.0 + Math.random() * 1.0;

            stickers.forEach(item => {
                const randomClass = COLOR_CLASSES[Math.floor(Math.random() * COLOR_CLASSES.length)];
                item.activeColorClass = randomClass;
                item.mesh.material.color.setHex(randomClass.hex);
            });

            cubeGroup.updateMatrixWorld(true);

            scene.background = new THREE.Color(
                Math.random() * 0.7 + 0.15,
                Math.random() * 0.7 + 0.15,
                Math.random() * 0.7 + 0.15
            );
        }

        function calculateYoloLabels() {
            const labels = [];
            const halfSize = 0.44;

            stickers.forEach(item => {
                const worldNormal = item.normal.clone().applyEuler(cubeGroup.rotation).normalize();
                const cameraRay = camera.position.clone().sub(item.mesh.getWorldPosition(new THREE.Vector3())).normalize();

                if (worldNormal.dot(cameraRay) < 0.15) return;

                const localCorners = [
                    new THREE.Vector3(-halfSize, -halfSize, 0),
                    new THREE.Vector3( halfSize, -halfSize, 0),
                    new THREE.Vector3( halfSize,  halfSize, 0),
                    new THREE.Vector3(-halfSize,  halfSize, 0)
                ];

                let minX = 1.0, maxX = 0.0, minY = 1.0, maxY = 0.0;

                localCorners.forEach(corner => {
                    const worldPos = corner.applyMatrix4(item.mesh.matrixWorld);
                    const screenPos = worldPos.project(camera);

                    const normX = (screenPos.x + 1) / 2;
                    const normY = (1 - screenPos.y) / 2;

                    minX = Math.min(minX, normX);
                    maxX = Math.max(maxX, normX);
                    minY = Math.min(minY, normY);
                    maxY = Math.max(maxY, normY);
                });

                minX = Math.max(0, Math.min(1, minX));
                maxX = Math.max(0, Math.min(1, maxX));
                minY = Math.max(0, Math.min(1, minY));
                maxY = Math.max(0, Math.min(1, maxY));

                const width = maxX - minX;
                const height = maxY - minY;

                if (width > 0.02 && height > 0.02) {
                    const xCenter = minX + width / 2;
                    const yCenter = minY + height / 2;
                    labels.push(`${item.activeColorClass.id} ${xCenter.toFixed(6)} ${yCenter.toFixed(6)} ${width.toFixed(6)} ${height.toFixed(6)}`);
                }
            });

            return labels;
        }

        generateBtn.addEventListener('click', async () => {
            const totalSamples = parseInt(document.getElementById('samples-count').value, 10);
            const resSelect = document.getElementById('resolution-select');
            const resSize = resSelect ? parseInt(resSelect.value, 10) : 640;

            generateBtn.disabled = true;
            randomizeBtn.disabled = true;
            progressContainer.style.display = 'block';
            statusEl.innerText = 'Rendering Dataset...';
            statusEl.style.color = '#ff9800';

            const zip = new JSZip();
            const trainImgFolder = zip.folder("images/train");
            const valImgFolder   = zip.folder("images/val");
            const trainLblFolder = zip.folder("labels/train");
            const valLblFolder   = zip.folder("labels/val");

            const yamlContent = `# Ultralytics YOLO dataset configuration
path: ../dataset
train: images/train
val: images/val

names:
  0: white
  1: yellow
  2: green
  3: blue
  4: red
  5: orange
`;
            zip.file("data.yaml", yamlContent);

            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = resSize;
            offscreenCanvas.height = resSize;
            const offscreenRenderer = new THREE.WebGLRenderer({
                canvas: offscreenCanvas,
                preserveDrawingBuffer: true,
                antialias: true
            });
            offscreenRenderer.setSize(resSize, resSize);

            const offscreenCamera = camera.clone();
            offscreenCamera.aspect = 1.0;
            offscreenCamera.updateProjectionMatrix();

            for (let i = 1; i <= totalSamples; i++) {
                randomizeCubeAppearance();
                offscreenRenderer.render(scene, offscreenCamera);

                const labels = calculateYoloLabels();
                const baseName = `synth_${String(i).padStart(5, '0')}`;

                const isValidation = (i % 5 === 0);
                const targetImgFolder = isValidation ? valImgFolder : trainImgFolder;
                const targetLblFolder = isValidation ? valLblFolder : trainLblFolder;

                targetLblFolder.file(`${baseName}.txt`, labels.join('\n'));

                const blob = await new Promise(resolve => offscreenCanvas.toBlob(resolve, 'image/jpeg', 0.92));
                targetImgFolder.file(`${baseName}.jpg`, blob);

                const progress = Math.round((i / totalSamples) * 100);
                progressBar.style.width = `${progress}%`;
                resultBox.innerText = `Generated: ${i} / ${totalSamples} (${progress}%)\nSplit: [${isValidation ? 'VAL' : 'TRAIN'}]`;

                await new Promise(r => setTimeout(r, 10));
            }

            statusEl.innerText = 'Archiving ZIP...';
            resultBox.innerText = 'Compressing package... Please wait.';

            const content = await zip.generateAsync({ type: "blob" });
            const downloadUrl = URL.createObjectURL(content);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = `rubiks_synth_${totalSamples}.zip`;
            link.click();
            URL.revokeObjectURL(downloadUrl);

            statusEl.innerText = 'Dataset Ready!';
            statusEl.style.color = '#4CAF50';
            resultBox.innerText = `Successfully exported ${totalSamples} synthetic samples.`;

            generateBtn.disabled = false;
            randomizeBtn.disabled = false;
        });

        randomizeBtn.addEventListener('click', () => {
            randomizeCubeAppearance();
        });

        window.addEventListener('resize', () => {
            const w = container.clientWidth || (window.innerWidth - 700);
            const h = container.clientHeight || window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
